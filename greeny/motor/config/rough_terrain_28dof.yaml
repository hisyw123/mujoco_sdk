# Full actuated-joint contract for the RoughTerrain biped/quadruped models.
# CAM_J is included at index 0. L_gripper_J is
# constrained 1:1 to R_gripper_J by the XML equality and has no actuator.
motors:
  - {name: CAM_J, joint_index: 0, joint_name: CAM_J, actuator_name: CAM_J, p_gain: 40.0, d_gain: 2.0}
